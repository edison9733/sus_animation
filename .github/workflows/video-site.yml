# Builds the video site (https://edison9733.github.io/sus_animation/): one page that plays every version's MP4.
# It takes the MP4 at the root of every branch, so each video is stored once, on its own branch.
# Runs on every push to main. After adding an MP4 to an older branch only, run it by hand (Actions → Video site → Run workflow).
name: Video site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect the MP4 from every branch
        run: |
          mkdir -p _site
          : > _site/videos.tsv
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx HEAD); do
            git ls-tree --name-only "origin/$b" | grep -E '\.mp4$' | while read -r f; do
              git show "origin/$b:$f" > "_site/$f"
              printf '%s\t%s\t%s\n' "$b" "$f" "$(git log -1 --format=%cs "origin/$b")" >> _site/videos.tsv
            done
          done
          cat _site/videos.tsv
      - name: Make a light 720p copy and a poster of each video (the page plays these, so it starts fast on slow links)
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p _site/web/480
          cut -f2 _site/videos.tsv | while read -r f; do
            ffmpeg -nostdin -y -loglevel error -i "_site/$f" -vf "fps=30,scale=-2:720:flags=lanczos" -c:v libx264 -preset medium -crf 26 \
              -maxrate 1M -bufsize 2M -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "_site/web/$f"
            # 480p for slow connections: about 180 kbit/s (22 KB/s), so it plays without pausing on a 25 KB/s link
            ffmpeg -nostdin -y -loglevel error -i "_site/$f" -vf "fps=30,scale=-2:480:flags=lanczos" -c:v libx264 -preset slow -tune animation -crf 30 \
              -maxrate 140k -bufsize 280k -pix_fmt yuv420p -c:a aac -b:a 40k -ac 2 -movflags +faststart "_site/web/480/$f"
            ffmpeg -nostdin -y -loglevel error -ss 3.5 -i "_site/$f" -frames:v 1 -vf "scale=-2:720" -q:v 4 "_site/web/${f%.mp4}.jpg"
          done
          ls -la _site/web _site/web/480
          python3 .github/pages/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
