// The one model. Same numbers as the v3 film's W.kin(lv) in motion/modules/shared.js,
// rescaled from the film's 360-deep ground block to this figure's 150-deep block.
// lv runs from 0 (dry season) to 1 (the design flood: the worst remembered flood, marked on a fixed post).
// The proposal gives no sizes or depths (groundwater depth "must be measured on site"), so nothing here is in metres.

const BLOCK_DEPTH = 150;      // ground surface z = 0, block bottom z = -150
const FLOOD_MAX = 44;         // flood depth over the yard at lv = 1 = the design-flood mark
const PLINTH = 46;            // plinth height: "plinth above the design flood"
const PEG = [0.32, 0.67];     // green below 0.32, yellow to 0.67, red above (the film's thresholds)
const ROD = 190;              // float to pointer: the pointer rides the groundwater 190 units higher
const WORDS = ["use as usual", "treat drinking water", "seal the lid, use the pack"];
const COLOURS = ["green", "yellow", "red"];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

function kin(lv) {
  lv = clamp(lv);
  const gw = -BLOCK_DEPTH * (290 - 190 * lv) / 360;          // groundwater surface, z
  const h = FLOOD_MAX * clamp((lv - 0.5) / 0.5);              // floodwater depth over the yard
  const sig = lv < PEG[0] ? 0 : lv < PEG[1] ? 1 : 2;
  return { lv, gw, h, sig, pointer: gw + ROD };
}

// The pointer height at each peg boundary, so the coloured bands on the staff are where the model switches.
const BANDS = [0, PEG[0], PEG[1], 1].map((lv) => kin(lv).pointer);

// The film's scene 7 ("The signal", 36.5–42 s, 5.5 s), copied from scene-signal.js:
// the level rises in two steps, then at red the household slides the lid shut.
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const FILM_SECONDS = 5.5;
function filmAt(t) {
  const lv = 0.1 + 0.4 * eio(seg(t, 0.9, 1.8)) + 0.42 * eio(seg(t, 2.5, 3.4)) + 0.012 * Math.sin(t * 2.1);
  return { lv, lid: eio(seg(t, 3.8, 4.3)) };
}

// The idle tour on the page: the film's 5.5 s, a hold, then the water drains and the lid opens again.
const TOUR_SECONDS = 11;
function tourAt(t) {
  t %= TOUR_SECONDS;
  if (t < 7.2) return filmAt(Math.min(t, FILM_SECONDS));
  const end = filmAt(FILM_SECONDS);
  const d = eio(seg(t, 7.2, 9.6));
  return { lv: end.lv + (0.1 - end.lv) * d, lid: 1 - eio(seg(t, 9.2, 9.9)) };
}

function readoutOf(k, lid) {
  const flood = Math.round((100 * k.h) / FLOOD_MAX);
  const state = k.sig === 2 && lid > 0.98 ? "lid sealed" : lid > 0.02 && lid < 0.98 ? "lid sliding" : "lid open";
  return `${COLOURS[k.sig]} · ${state} · flood ${flood}% of mark`;
}

// Parts that change shape with the water. Pure: (kit, projection, geometry, pose) -> attribute values.
// The build calls it for the first frame, and the page inlines this same source and calls it every frame.

function dynamic(k, P, G) {
  const at = (p) => k.iso(p, P);
  const poly = (pts) => k.pathOf(pts.map(at), true);
  const front = (x0, x1, z0, z1) => poly([[x0, G.CUT, z0], [x1, G.CUT, z0], [x1, G.CUT, z1], [x0, G.CUT, z1]]);
  const side = (x, y0, y1, z0, z1) => poly([[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]]);
  const B = G.BLOCK;
  const xR = B.x + B.w, yB = B.y;

  // the band of a box's two visible outer faces under the water, minus any face that lies on the cut
  const boxBand = (p, h) => {
    const out = [side(p.x + p.w, p.y, p.y + p.d, 0, h)];
    if (p.y + p.d < G.CUT - 0.01) out.push(poly([[p.x, p.y + p.d, 0], [p.x + p.w, p.y + p.d, 0], [p.x + p.w, p.y + p.d, h], [p.x, p.y + p.d, h]]));
    return out.join("");
  };
  // the band on the visible part of a round post (or the half pipe on the cut)
  const roundBand = (cx, cy, r, h, cutY) => {
    const v = k.towardViewer(P), pts = [];
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * Math.PI * 2, nx = Math.cos(a), ny = Math.sin(a);
      if (nx * v[0] + ny * v[1] <= 0) continue;
      if (cutY !== undefined && cy + r * ny > cutY + 1e-6) continue;
      pts.push([cx + r * nx, cy + r * ny]);
    }
    if (pts.length < 2) return "";
    pts.sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
    return poly([...pts.map(([x, y]) => [x, y, 0]), ...pts.reverse().map(([x, y]) => [x, y, h])]);
  };

  return function draw(s) {
    const { gw, h, pointer } = s.k;
    const d = {};
    // groundwater: from the block bottom up to its surface, on the cut and on the right side
    d.gwFront = front(B.x, xR, -G.DEPTH, gw);
    d.gwSide = side(xR, yB, G.CUT, -G.DEPTH, gw);
    d.gwLine = k.pathOf([at([B.x, G.CUT, gw]), at([xR, G.CUT, gw]), at([xR, yB, gw])]);
    // inside the gauge pipe the water stands at the groundwater level; the float rides on it
    d.bore = front(G.GX - G.GBORE, G.GX + G.GBORE, -G.GDEEP, gw);
    d.float = front(G.GX - G.GBORE + 1, G.GX + G.GBORE - 1, gw - 3, gw + 5);
    d.rodLow = front(G.GX - 0.8, G.GX + 0.8, gw + 5, G.GTOP);
    // above the cap the rod is round; it is rebuilt to its length each frame
    const top = pointer;
    const rod = k.cylinder(G.GX, G.ROD_Y, 1.3, G.GTOP + 4, Math.max(0.1, top - G.GTOP - 4), P, 14);
    d.rodFill = rod.fill; d.rodShade = rod.shades.filter(Boolean).join(""); d.rodTop = rod.top; d.rodEdge = rod.outline;
    d.pointer = k.translateAlong(P, [0, 0, top]);
    d.lid = k.translateAlong(P, [0, -G.LID_TRAVEL * (1 - s.lid), 0]);
    // floodwater over the yard: a sheet at depth h, its two cut sides, and a band on everything standing in it
    const wet = h > 0.05;
    d.sheet = wet ? poly([[B.x, yB, h], [xR, yB, h], [xR, G.CUT, h], [B.x, G.CUT, h]]) : "";
    d.sheetRim = wet ? k.pathOf([at([B.x, G.CUT, h]), at([B.x, yB, h]), at([xR, yB, h])]) : "";
    d.sheetFront = wet ? front(B.x, xR, 0, h) : "";
    d.sheetSide = wet ? side(xR, yB, G.CUT, 0, h) : "";
    d.waterline = wet ? k.pathOf([at([B.x, G.CUT, h]), at([xR, G.CUT, h]), at([xR, yB, h])]) : "";
    for (const c of G.COLLARS) d["collar-" + c.id] = wet ? (c.round ? roundBand(c.cx, c.cy, c.r, Math.min(h, c.top ?? h), c.cutY) : boxBand(c.plan, Math.min(h, c.top ?? h))) : "";
    return d;
  };
}

const P = {"origin":[309.4315805031702,190.14254846771146],"scale":0.6306673324373664,"azimuth":58,"elevation":30};
const G = {"CUT":60,"DEPTH":150,"BLOCK":{"x":-170,"y":-110,"w":340,"d":170,"r":0},"GX":40,"GBORE":5,"GDEEP":140,"GTOP":60,"ROD_Y":56,"LID_TRAVEL":20,"COLLARS":[{"id":"plinth","plan":{"x":-130,"y":-50,"w":120,"d":110,"r":0}},{"id":"gauge","round":true,"cx":40,"cy":60,"r":7,"cutY":60},{"id":"staff","plan":{"x":50,"y":42,"w":10,"d":5,"r":0.6}},{"id":"post","plan":{"x":146,"y":-96,"w":8,"d":8,"r":0.8}},{"id":"wash0","plan":{"x":90.5,"y":-61.5,"w":3,"d":3}},{"id":"wash1","plan":{"x":106.5,"y":-61.5,"w":3,"d":3}},{"id":"well","round":true,"cx":122,"cy":24,"r":13.4,"top":14},{"id":"wpost0","plan":{"x":103,"y":22,"w":4,"d":4}},{"id":"wpost1","plan":{"x":137,"y":22,"w":4,"d":4}}]};
const k = { iso, pathOf, cylinder, translateAlong, towardViewer };
const drawAt = dynamic(k, P, G);
const svg = document.querySelector(".iso-stage svg");
const nodes = [...svg.querySelectorAll("[data-d]")].map((el) => [el, el.dataset.d, "d"]).concat([...svg.querySelectorAll("[data-d-t]")].map((el) => [el, el.dataset.dT, "transform"]));
const readout = document.querySelector("[data-readout]");
const stage = document.querySelector(".iso-stage");
const last = {};
function paint(lv, lid) {
  const kk = kin(lv), d = drawAt({ k: kk, lid });
  for (const [el, id, attr] of nodes) if (last[id] !== d[id]) { el.setAttribute(attr, d[id]); last[id] = d[id]; }
  const text = readoutOf(kk, lid);
  if (readout.textContent !== text) readout.textContent = text;
  return kk;
}
window.renderAt = (t) => { const s = filmAt(t); const kk = paint(s.lv, s.lid); window.dispatchEvent(new CustomEvent("fs-frame", { detail: { t, sig: kk.sig } })); return true; };

const caps = [...document.querySelectorAll("[data-cap]")];
const fadeIn = (t, t0) => { const a = Math.min(1, Math.max(0, (t - t0) / 0.5)); const e = 1 - Math.pow(1 - a, 3); return { o: e, x: 40 * (1 - e) }; };
window.addEventListener("fs-frame", (ev) => {
  const t = ev.detail.t;
  const a = fadeIn(t, -0.3), out = 1 - Math.min(1, Math.max(0, (t - 3.3) / 0.35));
  caps[0].style.opacity = (a.o * out).toFixed(3); caps[0].style.transform = "translateX(" + a.x.toFixed(1) + "px)";
  const b = fadeIn(t, 3.75); caps[1].style.opacity = b.o.toFixed(3); caps[1].style.transform = "translateX(" + b.x.toFixed(1) + "px)";
});
window.renderAt(0);
</script></body></html>
